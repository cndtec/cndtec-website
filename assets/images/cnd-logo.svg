<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" role="img" aria-label="CND TECH — Measure What Matters">
  <title>CND TECH</title>
  <defs>
    <style>
      .icon-dark { fill: none; stroke: #232323; stroke-linecap: butt; }
      .icon-orange { fill: none; stroke: #F29400; stroke-linecap: butt; }
      .text-orange { fill: #F29400; font-family: 'Arial Black', 'Franklin Gothic Heavy', sans-serif; font-weight: 900; }
      .text-dark { fill: #232323; font-family: 'Arial Black', 'Franklin Gothic Heavy', sans-serif; font-weight: 900; }
      .text-sub { fill: #232323; font-family: Arial, sans-serif; font-weight: 400; letter-spacing: 3.5px; }
    </style>
  </defs>

  <!-- ── C 아이콘 (중심 88, 90) ── -->
  <!-- 바깥 C: r=74, sw=14, 열린각도 ±42° -->
  <path class="icon-dark" stroke-width="14"
    d="M 142.0 40.5 A 74 74 0 1 0 142.0 139.5" />

  <!-- 중간 C: r=51, sw=11, 오렌지 -->
  <path class="icon-orange" stroke-width="11"
    d="M 125.9 55.3 A 51 51 0 1 0 125.9 124.7" />

  <!-- 안쪽 C: r=30, sw=9 -->
  <path class="icon-dark" stroke-width="9"
    d="M 110.3 68.1 A 30 30 0 1 0 110.3 111.9" />

  <!-- ── 텍스트 ── -->
  <!-- CND (오렌지) + TECH (검정) -->
  <text x="182" y="108" font-size="68">
    <tspan class="text-orange">CND</tspan><tspan class="text-dark"> TECH</tspan>
  </text>

  <!-- MEASURE WHAT MATTERS -->
  <text class="text-sub" x="185" y="132" font-size="13.5">MEASURE WHAT MATTERS</text>
</svg>
