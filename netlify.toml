# =============================================
# Netlify 배포 설정 — CND TECH (씨앤디테크)
# 순수 정적 HTML/CSS 사이트
# =============================================

[build]
  publish = "."        # 빌드 도구 없음 — 루트를 그대로 배포
  command = ""         # 빌드 커맨드 없음

# ── 보안 헤더 (모든 페이지) ─────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; frame-src https://maps.google.com; frame-ancestors 'none';"

# ── 정적 에셋 캐시 (1년) ────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML 페이지 캐시 (재검증) ────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 리다이렉트 ──────────────────────────────
# 404 → 커스텀 404 페이지 (파일이 없으면 index로)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
  force = false
